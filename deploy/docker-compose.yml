services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: job_hunter_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: job_hunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: